# Overrides for the demo source database. Loaded with `postgres -c config_file=...` (see compose).
# Logical decoding for Debezium (pgoutput). Contract: overlay/contracts/README.md section 1.
listen_addresses = '*'
wal_level = logical
max_replication_slots = 4
max_wal_senders = 4
# Bound the WAL a stalled/dropped slot can pin. If Connect is down longer than this much WAL, the slot is
# invalidated (fail loudly, re-snapshot) rather than filling the host disk.
max_slot_wal_keep_size = 2GB
shared_buffers = 128MB
max_connections = 50
log_min_duration_statement = 500
log_line_prefix = '%m [%p] %u@%d '
