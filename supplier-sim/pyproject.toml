[project]
name = "supplier-sim"
version = "0.1.0"
description = "Simulated supplier: delivers purchase orders after the lead time by calling restock() in each store source"
requires-python = ">=3.12,<3.13"
dependencies = [
  "psycopg[binary]==3.3.6",
  "redis==8.1.0",
  "ddtrace==4.15.3",
  "datadog==0.55.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
