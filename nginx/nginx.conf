# Single ingress. Contract: overlay/contracts/README.md section 6.
# /api/availability/ -> inventory-api releases, weights from routing.conf (rendered by render-routing.sh).
# Everything else (/, /api/* other than availability, /config, /img/, /healthz) -> storefront.
worker_processes 2;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    # JSON access log: one line per request. upstream_addr identifies the release container,
    # upstream_release is the X-Release header the API sent.
    log_format json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$request_id",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time","upstream_release":"$upstream_http_x_release"}';
    access_log /dev/stdout json;

    include /etc/nginx/mime.types;
    sendfile on;
    keepalive_timeout 65;
    # Docker's embedded DNS is only consulted at start/reload (upstream names), so every release named in routing.conf must be running (routing.conf lists only releases with weight > 0; apply-routing.sh refuses a stopped one).

    # Defines `upstream stock_api` (weighted). Lives in a volume so it can be replaced at runtime.
    include /etc/nginx/routing/routing.conf;

    upstream storefront { server storefront:8000; keepalive 16; }
    upstream demo_control { server demo-control:8000; }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $remote_addr;
        # A retry to another release would silently cross versions and falsify the canary counts.
        proxy_next_upstream off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;

        location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }

        location /api/availability/ {
            proxy_pass http://stock_api;
            # X-Release from the API passes through to the client (proxies pass unknown upstream headers).
        }

        # Control panel (contracts section 12): no prefix strip (the app serves /control/...), basic auth is checked by the app.
        location /control/ {
            proxy_pass http://demo_control;      # no URI part: the request path is passed unchanged
            proxy_set_header Authorization $http_authorization;
            # No proxy_cache is configured, and the app sends Cache-Control: no-store itself.
        }

        # Every other /api path, /config, /img/, /healthz and the React build.
        location / {
            proxy_pass http://storefront;
        }
    }

    # Internal only: not published by compose; the Datadog Agent reaches it as nginx:8081.
    server {
        listen 8081;
        access_log off;
        allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; allow 127.0.0.1;
        deny all;
        location = /nginx_status { stub_status; }
    }
}
