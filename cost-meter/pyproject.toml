[project]
name = "cost-meter"
version = "0.1.0"
description = "Real-time cost estimate per vendor, sent to Datadog"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3==1.43.108",
    "datadog==0.55.0",
    "redis==8.1.0",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
