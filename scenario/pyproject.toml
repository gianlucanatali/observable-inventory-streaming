[project]
name = "scenario"
version = "0.1.0"
description = "Demo scenario CLI: seed, reset, sell-last-pair, verify, load, canary-check"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "redis==8.1.0",
]

[project.scripts]
scenario = "scenario.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scenario"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "fakeredis==2.39.0",
    "pytest==9.1.1",
]
