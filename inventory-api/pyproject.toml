[project]
name = "inventory-api"
version = "0.1.0"
description = "Stock lookup API (demo): one app, behaviour selected by CATALOGUE_MODE"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datadog==0.55.0",
    "ddtrace==4.15.3",
    "Flask==3.1.3",
    "gunicorn==26.2.0",
    "redis==8.1.0",
]

[dependency-groups]
dev = [
    "fakeredis==2.39.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
