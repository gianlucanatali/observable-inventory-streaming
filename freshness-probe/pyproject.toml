[project]
name = "freshness-probe"
version = "0.1.0"
description = "Freshness probe for the stock serving view"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datadog==0.55.0",
    "psycopg[binary]==3.3.6",
    "redis==8.1.0",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "fakeredis==2.39.0",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
