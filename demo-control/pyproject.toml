[project]
name = "demo-control"
version = "0.1.0"
description = "Demo control panel: the only writer of the demo parameters (contracts section 12)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Flask==3.1.3",
  "gunicorn==26.2.0",
  "confluent-kafka[avro,schemaregistry]==2.15.1",
  "psycopg[binary]==3.3.6",
  "redis==8.1.0",
  "ddtrace==4.15.3",
  "datadog==0.55.0",
  "boto3==1.43.108",
]

[dependency-groups]
dev = ["pytest==9.1.1", "fakeredis==2.39.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
