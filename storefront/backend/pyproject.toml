[project]
name = "urbanstreet-storefront"
version = "1.0.0"
description = "UrbanStreet storefront backend: cart events, offers, display-delay beacon, static UI."
requires-python = ">=3.12,<3.13"
dependencies = [
  "Flask==3.1.3",
  "gunicorn==26.2.0",
  "confluent-kafka[avro,schemaregistry]==2.15.1",
  "redis==8.1.0",
  "datadog==0.55.0",
  "ddtrace==4.15.3",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
